# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: circuit
      POSTGRES_PASSWORD: circuit
      POSTGRES_DB: circuit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
